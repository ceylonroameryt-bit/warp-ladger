name: CI/CD & Production Integrity Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Verification (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          INTERNAL_API_URL: "http://127.0.0.1:8001"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8001"

  backend:
    name: Backend & PostgreSQL Migration Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warpladger
          POSTGRES_PASSWORD: warppassword
          POSTGRES_DB: warpladger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Clean PostgreSQL Alembic Migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://warpladger:warppassword@localhost:5432/warpladger_test"
          APP_ENV: "test"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"

      - name: Run Migration Downgrade & Re-upgrade Smoke Test
        run: |
          alembic downgrade -1
          alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://warpladger:warppassword@localhost:5432/warpladger_test"
          APP_ENV: "test"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"

      - name: Run Backend Pytest Suite
        run: |
          pytest -v tests/test_golden_accounting_posting.py tests/test_security_csrf_and_ratelimit.py tests/test_tenant_isolation_bills.py tests/test_phase6_payments.py
        env:
          DATABASE_URL: "postgresql+asyncpg://warpladger:warppassword@localhost:5432/warpladger_test"
          APP_ENV: "test"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
          ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
          CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
